openapi: 3.1.0
info:
  title: BioSouk Identity and Access API
  version: 0.1.0
  license:
    name: Proprietary
  description: |
    Platform Domain authentication and authorization endpoints for Milestone 3.
    All responses use the standard BioSouk envelopes:
      success: { "data": ..., "meta": { "request_id": "uuid" } }
      error:   { "error": { "code": "...", "message": "...", "details": [], "request_id": "uuid" } }
    Source: docs/06-api-specification.md §4–§8 and specs/003-identity-access/spec.md.
  contact:
    name: BioSouk Platform Team
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.biosouk.com/api/v1
    description: Production

tags:
  - name: Auth
    description: Registration, login, session management
  - name: Users
    description: User profile retrieval and updates

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSuccessEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: An account with this email already exists.
                  details: []
                  request_id: 5f2b5c2e-8f1a-4a2b-9f3d-1c2d3e4f5a6b
        '422':
          $ref: '#/components/responses/BusinessValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain tokens
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSuccessEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials (same response for unknown user and wrong password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
                  details: []
                  request_id: 5f2b5c2e-8f1a-4a2b-9f3d-1c2d3e4f5a6b

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and obtain new tokens
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSuccessEnvelope'
        '401':
          description: Refresh token invalid, revoked, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: The refresh token is invalid or has expired.
                  details: []
                  request_id: 5f2b5c2e-8f1a-4a2b-9f3d-1c2d3e4f5a6b

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the presented refresh session
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Retrieve the current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Retrieve a user by id
      operationId: getUser
      description: Requires ownership of the resource or the admin role.
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a user
      operationId: updateUser
      description: Requires ownership of the resource or the admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT access token issued by /auth/login or /auth/refresh.

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Request validation failed (HTTP 400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed.
              details:
                - field: email
                  issue: must be a valid email address
              request_id: 5f2b5c2e-8f1a-4a2b-9f3d-1c2d3e4f5a6b
    BusinessValidationError:
      description: Business rule validation failed (HTTP 422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required or token invalid/expired (HTTP 401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication is required.
              details: []
              request_id: 5f2b5c2e-8f1a-4a2b-9f3d-1c2d3e4f5a6b
    Forbidden:
      description: Authenticated but not permitted (HTTP 403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
              details: []
              request_id: 5f2b5c2e-8f1a-4a2b-9f3d-1c2d3e4f5a6b
    NotFound:
      description: Resource not found (HTTP 404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
      required: [request_id]

    Error:
      type: object
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, RESOURCE_NOT_FOUND, INTERNAL_ERROR]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        request_id:
          type: string
          format: uuid
      required: [code, message, request_id]

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required: [error]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, active, suspended, closed]
        roles:
          type: array
          items:
            type: string
          examples: [["customer"], ["admin"]]
        email_verified_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, email, status, roles, created_at, updated_at]

    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds
          example: 2592000
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: false
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
      required: [email]

    TokenSuccessEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Tokens'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [data, meta]

    UserSuccessEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [data, meta]
